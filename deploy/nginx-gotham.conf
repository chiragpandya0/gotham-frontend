# Gotham (Unified CCTV Grid) — production nginx config, POST-Certbot.
#
# This is what /etc/nginx/sites-available/gotham looks like on the live
# server (verify against the running config — see the README for how to
# check). Certbot's `--nginx` plugin generated the two server blocks below
# and the `# managed by Certbot` markers itself, by rewriting the bootstrap
# config in deploy/nginx-gotham-bootstrap.conf — you should not hand-write
# this file from scratch. It's checked in for reference and disaster
# recovery: if the live file is ever lost or corrupted, restore this, then
# run `certbot certificates` to confirm the cert paths below still exist
# before reloading nginx.
#
# See the README's "API + Swagger docs" section before touching the
# location /api/docs or location /api/ blocks — /api/docs is a rewrite to
# the backend's unprefixed /docs route, not a fallthrough of /api/.

server {
    if ($host = gotham.heliosinfotech.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gotham.heliosinfotech.in;

    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gotham.heliosinfotech.in;
    ssl_certificate /etc/letsencrypt/live/gotham.heliosinfotech.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gotham.heliosinfotech.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gotham;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|svg|jpg|jpeg|png|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # FastAPI's interactive docs live at the backend's root /docs, not under
    # /api — this is a separate rewrite, not a fallthrough of the block
    # below. Matched over it because nginx picks the longest literal prefix,
    # not file order (same rule as Pulse's /api/v2/ vs /api/ split).
    location /api/docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stopgap for the same reason as /api/docs above: Swagger UI's embedded
    # JS requests the spec at an absolute /openapi.json (not /api-prefixed),
    # which would otherwise fall through to the SPA's index.html and break
    # "Unable to render this definition" in the browser. See README §3.4 —
    # the correct fix is backend-side (`--root-path /api`), which would make
    # this block unnecessary; keep it until that's done.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — the backend already owns the /api prefix on its own
    # routes (confirmed: GET /api/me, not GET /me), so this is a plain
    # pass-through. No trailing slash on proxy_pass = no path rewrite.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: normalize /api (without trailing slash)
    location = /api {
        return 301 /api/;
    }
}
