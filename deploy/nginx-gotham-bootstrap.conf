# Gotham (Unified CCTV Grid) — bootstrap nginx config, PRE-Certbot.
#
# HTTP only — no `listen ... ssl`, no `ssl_certificate` line, so there is
# nothing in it that can fail to load before a certificate exists. Install
# this first, confirm it serves the site, THEN run Certbot. See the README's
# "Ubuntu production setup" section for why the order matters.
#
# Certbot's --nginx plugin will rewrite this file in place once it issues
# the certificate — you don't hand-edit the SSL parts afterward. The
# post-Certbot shape is checked in at deploy/nginx-gotham.conf for reference.

server {
    listen 80;
    listen [::]:80;
    server_name gotham.heliosinfotech.in;

    root /var/www/gotham;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|svg|jpg|jpeg|png|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # FastAPI's interactive docs live at the backend's root /docs, not under
    # /api — this is a separate rewrite, not a fallthrough of the block
    # below. See the README's "API + Swagger docs" section.
    location /api/docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — the backend already owns the /api prefix on its own
    # routes (confirmed: GET /api/me, not GET /me), so this is a plain
    # pass-through. No trailing slash on proxy_pass = no path rewrite.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: normalize /api (without trailing slash)
    location = /api {
        return 301 /api/;
    }
}
